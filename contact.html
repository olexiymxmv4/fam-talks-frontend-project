<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAM-TALKS - Contacts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="main-header">
        <div class="header-container">
            <a href="main.html" class="brand-link">
            <img src="photo_2026-02-08_23-17-08.jpg" width="50" height="50" alt="">
            FAM-TALKS
            </a>            
            <a href="login.html" class="login-btn">Login</a>
        </div>
    </header>

    <main class="main-layout">
        <section class="content-area">
            <h1>Contact us!</h1>
        
            <table class="info-table" aria-label="Графік роботи служби підтримки">
            <caption>Support service working hours</caption>
            <thead>
                <tr>
                    <th scope="col">Day</th>
                    <th scope="col">Hours</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Mon - Fri</td>
                    <td>09:00 - 18:00</td>
                </tr>
                <tr>
                    <td>Sat - Sun</td>
                    <td>Holidays</td>
                </tr>
            </tbody>
            </table>

            <form action="/submit-contact" method="POST" class="contact-form">
            <fieldset>
                <legend>Leave us your message</legend>
                <label for="topic">Topic</label>
                <select id="topic" name="topic">
                    <option value="tech">Technical</option>
                    <option value="collab">Cooperation</option>
                    <option value="other">Other</option>
                </select>

                <label for="message">Your message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="submit-btn">Send</button>
            </fieldset>
            </form>
        </section>
                <!-- sidebar -->
        <aside class="sidebar">
            <h2>Tags</h2>
            <ul class="tags-list">
                <li><a href="#">#tag1</a></li>
                <li><a href="#">#news</a></li>
                <li><a href="#">#design</a></li>
                <li><a href="#">#tech</a></li>
                <li><a href="tag.html">#math</a></li>
            </ul>
        </aside>
    </main>

    <!-- auxiliary info pages -->
    <footer class="site-footer">
        <nav aria-label="Нижня навігація">
            <ul class="footer-links">
                <li><a href="contact.html">contact</a></li>
                <li><a href="#">policy</a></li>
                <li><a href="#">about</a></li>
                <li><a href="#">faq</a></li>
            </ul>
        </nav>
    </footer>

</body>
</html>
